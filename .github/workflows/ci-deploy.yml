name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  SSH_OPTS: "-o StrictHostKeyChecking=yes -o BatchMode=yes"
  VPS_HOST: "russell@2.28.124.111"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # No real API keys — tests that need them are guarded by
      # @EnabledIfEnvironmentVariable and will be skipped.
      # AgentChatApplicationTests (@SpringBootTest) needs dummy env vars
      # to satisfy property bindings but makes no external calls.
      - name: Build & test agent
        run: mvn -B clean verify -Dgroups='!live'
        env:
          CEREBRAS_API_KEY: dummy-ci
          OPENAI_API_KEY: dummy-ci
          TELEGRAM_BOT_TOKEN: dummy-ci
          TELEGRAM_CHAT_ID: "0"

      - name: Build & test MCP server
        run: mvn -B clean verify
        working-directory: mcp-server

      - name: Build & test weather server
        run: mvn -B clean verify
        working-directory: weather-server

      - name: Upload agent jar
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: agent-jar
          path: target/agent-chat-0.0.1-SNAPSHOT.jar

      - name: Upload MCP server jar
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: mcp-jar
          path: mcp-server/target/mcp-server-0.0.1-SNAPSHOT.jar

      - name: Upload weather server jar
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: weather-jar
          path: weather-server/target/weather-server-0.0.1-SNAPSHOT.jar

  # Advisory AI code review — runs on PRs, non-blocking.
  # Uses a restricted SSH key that can only run the aiac-review script.
  pr-review:
    needs: build-and-test
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: pr-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up SSH (review key)
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.VPS_REVIEW_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.VPS_REVIEW_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Generate and sanitize diff
        id: gather
        run: |
          set -euo pipefail

          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          # Generate diff excluding binary, generated, and secret files
          git diff "$BASE_SHA".."$HEAD_SHA" \
            -- . \
            ':!*.jar' ':!*.class' ':!*.lock' ':!package-lock.json' ':!yarn.lock' \
            ':!target/' ':!*.png' ':!*.jpg' ':!*.gif' ':!*.ico' ':!*.woff' ':!*.woff2' \
            ':!.env' ':!credentials.json' ':!token.json' ':!*.pem' ':!*.key' ':!*.p12' \
            ':!.google-tokens/' ':!*.DS_Store' \
            > /tmp/pr_raw.diff

          # Redact obvious secrets/tokens (inline patterns)
          sed -E \
            -e 's/(csk-)[A-Za-z0-9_-]{10,}/\1REDACTED/g' \
            -e 's/(sk-)[A-Za-z0-9_-]{10,}/\1REDACTED/g' \
            -e 's/(Bearer )[A-Za-z0-9._-]{10,}/\1REDACTED/g' \
            -e 's/-----BEGIN [A-Z ]+ KEY-----/-----BEGIN REDACTED KEY-----/g' \
            /tmp/pr_raw.diff > /tmp/pr.diff

          # Changed files list (filtered the same way)
          git diff --name-only "$BASE_SHA".."$HEAD_SHA" \
            -- . \
            ':!*.jar' ':!*.class' ':!*.lock' ':!package-lock.json' ':!yarn.lock' \
            ':!target/' ':!*.png' ':!*.jpg' ':!*.gif' ':!*.ico' ':!*.woff' ':!*.woff2' \
            ':!.env' ':!credentials.json' ':!token.json' ':!*.pem' ':!*.key' ':!*.p12' \
            ':!.google-tokens/' \
            | head -30 > /tmp/changed_files.txt

          DIFF_SIZE=$(wc -c < /tmp/pr.diff | tr -d ' ')
          FILE_COUNT=$(wc -l < /tmp/changed_files.txt | tr -d ' ')
          echo "Diff size: ${DIFF_SIZE} bytes, ${FILE_COUNT} changed files"

          if [ "$DIFF_SIZE" -eq 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run AI code review
        id: review
        if: steps.gather.outputs.skip != 'true'
        run: |
          set -euo pipefail

          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_BODY="${{ github.event.pull_request.body }}"

          # Build JSON payload safely with python3
          python3 -c "
          import json, sys

          diff = open('/tmp/pr.diff').read()
          changed = [l.strip() for l in open('/tmp/changed_files.txt') if l.strip()]

          payload = {
              'diff': diff,
              'changedFiles': changed,
              'prTitle': sys.argv[1],
              'prDescription': sys.argv[2]
          }
          sys.stdout.buffer.write(json.dumps(payload).encode())
          " "$PR_TITLE" "$PR_BODY" \
            | ssh $SSH_OPTS $VPS_HOST 'cat' \
            > /tmp/review_response.json

          # Extract review text
          python3 -c "
          import json, sys
          try:
              d = json.load(open('/tmp/review_response.json'))
              review = d.get('review', '')
              if not review:
                  error = d.get('error', 'No review returned')
                  print(f'Review endpoint returned error: {error}', file=sys.stderr)
                  sys.exit(1)
              print(review)
          except json.JSONDecodeError:
              raw = open('/tmp/review_response.json').read()[:500]
              print(f'Invalid JSON response: {raw}', file=sys.stderr)
              sys.exit(1)
          " > /tmp/review_text.md

      - name: Post or update review comment
        if: steps.gather.outputs.skip != 'true' && steps.review.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          PR_NUM="${{ github.event.pull_request.number }}"
          REPO="${{ github.repository }}"
          MARKER="<!-- aiac-review -->"

          # Build final comment
          {
            echo "$MARKER"
            echo "## AI Code Review"
            echo ""
            echo "_Powered by Cerebras gpt-oss-120b with RAG codebase context_"
            echo ""
            cat /tmp/review_text.md
          } > /tmp/final_comment.md

          BODY=$(cat /tmp/final_comment.md)

          # Find existing review comment
          EXISTING=$(gh api "repos/$REPO/issues/$PR_NUM/comments" \
            --jq ".[] | select(.body | contains(\"$MARKER\")) | .id" \
            | head -1 || true)

          if [ -n "$EXISTING" ]; then
            echo "Updating existing review comment $EXISTING"
            gh api "repos/$REPO/issues/comments/$EXISTING" \
              -X PATCH -f body="$BODY"
          else
            echo "Creating new review comment"
            gh pr comment "$PR_NUM" --body-file /tmp/final_comment.md
          fi

      - name: Post error comment if review failed
        if: steps.gather.outputs.skip != 'true' && steps.review.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          PR_NUM="${{ github.event.pull_request.number }}"
          REPO="${{ github.repository }}"
          MARKER="<!-- aiac-review -->"

          BODY="${MARKER}
          ## AI Code Review

          Review failed to complete. Check the [Actions log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details."

          EXISTING=$(gh api "repos/$REPO/issues/$PR_NUM/comments" \
            --jq ".[] | select(.body | contains(\"$MARKER\")) | .id" \
            | head -1 || true)

          if [ -n "$EXISTING" ]; then
            gh api "repos/$REPO/issues/comments/$EXISTING" \
              -X PATCH -f body="$BODY"
          else
            gh pr comment "$PR_NUM" --body "$BODY"
          fi

  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Download jars
        uses: actions/download-artifact@v4

      - name: Set up SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Preflight — verify sudo and VPS connectivity
        run: |
          set -euo pipefail
          ssh $SSH_OPTS $VPS_HOST 'sudo -n true' \
            || { echo "::error::Passwordless sudo is not available for russell on VPS"; exit 1; }
          echo "SSH and sudo OK."

      - name: Create directories on VPS
        run: |
          set -euo pipefail
          ssh $SSH_OPTS $VPS_HOST \
            "mkdir -p /opt/aiac/mcp/data /opt/aiac/agent/data /opt/aiac/agent/profiles /opt/aiac/notes /opt/aiac/weather /opt/aiac/bin"

      - name: Sync git repo for MCP git tools
        run: |
          set -euo pipefail
          rsync -a --delete \
            -e "ssh $SSH_OPTS" \
            --exclude='target/' --exclude='.idea/' --exclude='*.jar' \
            --exclude='.google-tokens/' --exclude='data/' \
            --exclude='.env' --exclude='credentials.json' \
            ./ $VPS_HOST:/opt/aiac/repo/

      - name: Upload jars to staging & back up current
        run: |
          set -euo pipefail
          # Upload to temp locations
          scp $SSH_OPTS agent-jar/agent-chat-0.0.1-SNAPSHOT.jar     $VPS_HOST:/opt/aiac/agent/agent.jar.new
          scp $SSH_OPTS mcp-jar/mcp-server-0.0.1-SNAPSHOT.jar       $VPS_HOST:/opt/aiac/mcp/mcp-server.jar.new
          scp $SSH_OPTS weather-jar/weather-server-0.0.1-SNAPSHOT.jar $VPS_HOST:/opt/aiac/weather/weather-server.jar.new

          # Back up current jars (if they exist) and atomically move new ones in
          ssh $SSH_OPTS $VPS_HOST 'set -euo pipefail
            for pair in \
              "/opt/aiac/agent/agent.jar" \
              "/opt/aiac/mcp/mcp-server.jar" \
              "/opt/aiac/weather/weather-server.jar"; do
              if [ -f "$pair" ]; then
                cp "$pair" "${pair}.bak"
              fi
              mv "${pair}.new" "$pair"
            done
          '

      - name: Install review script
        run: |
          set -euo pipefail
          scp $SSH_OPTS deploy/aiac-review.sh $VPS_HOST:/opt/aiac/bin/aiac-review
          ssh $SSH_OPTS $VPS_HOST "chmod +x /opt/aiac/bin/aiac-review"

      - name: Sync profiles
        run: |
          set -euo pipefail
          if [ -d profiles ] && [ "$(ls -A profiles 2>/dev/null)" ]; then
            rsync -a -e "ssh $SSH_OPTS" profiles/ $VPS_HOST:/opt/aiac/agent/profiles/
          fi

      - name: Install systemd units
        run: |
          set -euo pipefail
          scp $SSH_OPTS \
            deploy/aiac-mcp.service \
            deploy/aiac-weather.service \
            deploy/aiac-agent.service \
            $VPS_HOST:/tmp/
          ssh $SSH_OPTS $VPS_HOST 'set -euo pipefail
            sudo mv /tmp/aiac-mcp.service     /etc/systemd/system/aiac-mcp.service
            sudo mv /tmp/aiac-weather.service  /etc/systemd/system/aiac-weather.service
            sudo mv /tmp/aiac-agent.service    /etc/systemd/system/aiac-agent.service
            sudo systemctl daemon-reload
            sudo systemctl enable aiac-mcp aiac-weather aiac-agent
          '

      - name: Restart MCP server
        id: restart-mcp
        run: |
          set -euo pipefail
          ssh $SSH_OPTS $VPS_HOST 'set -euo pipefail
            sudo systemctl restart aiac-mcp
            echo "Waiting for MCP server on port 8081..."
            for i in $(seq 1 30); do
              ss -tlnp | grep -q ":8081" && echo "Port 8081 is open." && exit 0
              sleep 2
            done
            echo "::error::MCP server did not start within 60s"
            sudo journalctl -u aiac-mcp --no-pager -n 30
            exit 1
          '

      - name: Restart weather server
        id: restart-weather
        run: |
          set -euo pipefail
          ssh $SSH_OPTS $VPS_HOST 'set -euo pipefail
            sudo systemctl restart aiac-weather
            echo "Waiting for weather server on port 8082..."
            for i in $(seq 1 30); do
              ss -tlnp | grep -q ":8082" && echo "Port 8082 is open." && exit 0
              sleep 2
            done
            echo "::error::Weather server did not start within 60s"
            sudo journalctl -u aiac-weather --no-pager -n 30
            exit 1
          '

      - name: Restart agent
        id: restart-agent
        run: |
          set -euo pipefail
          ssh $SSH_OPTS $VPS_HOST 'set -euo pipefail
            sudo systemctl restart aiac-agent
            echo "Waiting for agent on port 8080..."
            for i in $(seq 1 30); do
              CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/ 2>/dev/null || true)
              [ "$CODE" = "200" ] && echo "Agent is up (HTTP 200)." && exit 0
              sleep 3
            done
            echo "::error::Agent did not become healthy within 90s"
            sudo journalctl -u aiac-agent --no-pager -n 30
            exit 1
          '

      - name: Rollback on failure
        if: failure() && (steps.restart-mcp.outcome == 'failure' || steps.restart-weather.outcome == 'failure' || steps.restart-agent.outcome == 'failure')
        run: |
          set -euo pipefail
          echo "::warning::Service restart failed — rolling back to previous jars"
          ssh $SSH_OPTS $VPS_HOST 'set -euo pipefail
            ROLLED_BACK=false
            for pair in \
              "/opt/aiac/agent/agent.jar" \
              "/opt/aiac/mcp/mcp-server.jar" \
              "/opt/aiac/weather/weather-server.jar"; do
              if [ -f "${pair}.bak" ]; then
                mv "${pair}.bak" "$pair"
                ROLLED_BACK=true
              fi
            done

            if [ "$ROLLED_BACK" = true ]; then
              echo "Restored backup jars. Restarting services..."
              sudo systemctl restart aiac-mcp
              sleep 5
              sudo systemctl restart aiac-weather
              sleep 5
              sudo systemctl restart aiac-agent
              sleep 5
              sudo systemctl status aiac-mcp aiac-weather aiac-agent --no-pager -l \
                | grep -E "Loaded|Active|Main PID"
            else
              echo "::error::No backup jars found — cannot roll back"
            fi
          '
          exit 1

      - name: Trigger RAG reindex via SSH
        run: |
          set -euo pipefail
          ssh $SSH_OPTS $VPS_HOST 'set -euo pipefail
            echo "Triggering RAG reindex on localhost..."
            HTTP_CODE=$(curl -sf -o /dev/null -w "%{http_code}" -X POST http://127.0.0.1:8080/indexer/reindex || true)
            echo "Reindex response: HTTP $HTTP_CODE"
          '

      - name: Verify services
        run: |
          set -euo pipefail
          ssh $SSH_OPTS $VPS_HOST 'set -euo pipefail
            sudo systemctl status aiac-mcp aiac-weather aiac-agent --no-pager -l \
              | grep -E "Loaded|Active|Main PID"
          '

      - name: Clean up backup jars
        if: success()
        run: |
          ssh $SSH_OPTS $VPS_HOST '
            rm -f /opt/aiac/agent/agent.jar.bak \
                  /opt/aiac/mcp/mcp-server.jar.bak \
                  /opt/aiac/weather/weather-server.jar.bak
          '
